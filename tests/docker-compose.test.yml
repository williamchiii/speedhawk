services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: speedhawk_test
      POSTGRES_PASSWORD: speedhawk_test
      POSTGRES_DB: speedhawk_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedhawk_test -d speedhawk_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
